kind = "web"
previewPath = "/"
title = "Solana Smart-Money Tracker"
description = "The existing Python Flask dashboard for read-only Solana smart-money signals, consensus buys, and historical winner data."
version = "1.0.0"
id = "artifacts/smartmoney-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18182

[services.development]
run = "cd ../../smartmoney-app && python main.py serve"

[services.production.build]
args = ["bash", "-lc", "if [ -f pyproject.toml ]; then uv sync --locked; else uv sync --project ../.. --locked; fi"]

[services.production.run]
args = ["bash", "-lc", "cd ../../smartmoney-app && exec uv run --project .. --locked --no-sync python -m gunicorn --chdir . --workers 1 --worker-class gthread --threads 4 --bind 0.0.0.0:$PORT smartmoney.wsgi:app"]

[services.env]
PORT = "18182"
BASE_PATH = "/"
